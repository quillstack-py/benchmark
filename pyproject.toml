[project]
name = "quillstack-benchmark"
version = "0.1.0"
description = "Measures one implementation against another, the way a benchmark has to be run to be evidence: interleaved, a median, and the whole cost as well as the part."
readme = "README.md"
license = "MIT"
authors = [{ name = "Radek Ziemniewicz", email = "radek@quillstack.org" }]
requires-python = ">=3.11"
keywords = ["benchmark", "performance", "measurement", "quillstack", "python3"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://quillstack.org/python/packages/benchmark"
Source = "https://github.com/quillstack-py/benchmark"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "quillstack-standards>=0.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quillstack"]

[tool.hatch.build.targets.wheel.force-include]
"src/quillstack/benchmark/py.typed" = "quillstack/benchmark/py.typed"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# The multiplication sign is the one meant. A table saying `14.7x` is a table with a letter in
# it, and every Quillstack README in either language uses this one.
allowed-confusables = ["×", "µ"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
